<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="Decora — AI-powered furniture matching">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Decora{% endblock %}</title>

    <link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/svg+xml">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Aldrich&family=Poppins:wght@300;400;500;600;700&display=swap">

    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>

<header class="site-header">
    <a href="{{ url_for('home') }}" class="logo-text">DECORA</a>
</header>

<main class="content">

  {% for message in get_flashed_messages() %}
    <div class="alert" role="alert">
      <span class="alert__text">{{ message }}</span>
      <button type="button" class="alert__close" aria-label="Dismiss this message">&times;</button>
    </div>
  {% endfor %}
  {% block content %}{% endblock %}

</main>

<footer class="site-footer">
    Built by Iffat Abdul Azeez &mdash;
    <a href="https://github.com/iffataz" target="_blank" rel="noopener">GitHub</a>
    &nbsp;&middot;&nbsp; &copy; 2026
</footer>

<script>
    // Dismiss flash messages (replaces Bootstrap's JS alert plugin + jQuery).
    document.addEventListener('click', function (event) {
        var close = event.target.closest('.alert__close');
        if (close) {
            close.parentElement.remove();
        }
    });
</script>
</body>
</html>
